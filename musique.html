<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ma musique — Accès privé</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2440, #2a3a5c);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .boite {
      background: white; border-radius: 20px;
      padding: 40px 28px; max-width: 450px; width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; display: block; }
    h1 { font-size: 20px; font-weight: 900; color: #1a2440; margin-bottom: 8px; }
    p.intro { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 24px; }
    input {
      width: 100%; padding: 14px;
      border: 2px solid #d4af6a; border-radius: 10px;
      background: #fdf9f3;
      font-family: 'Nunito', sans-serif;
      font-size: 22px; text-align: center;
      letter-spacing: 0.3rem; color: #1a2440;
      outline: none; margin-bottom: 14px;
      text-transform: uppercase;
    }
    .btn-valider {
      width: 100%; padding: 14px;
      background: #1a2440; color: white;
      border: none; border-radius: 10px; cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 15px; font-weight: 800;
      margin-bottom: 12px;
    }
    .erreur {
      display: none; color: #c0392b; font-size: 13px;
      margin-bottom: 12px; line-height: 1.5;
    }
    .retour {
      display: inline-block; color: #aaa;
      font-size: 12px; text-decoration: none;
      margin-top: 4px;
    }

    .lecteur { display: none; text-align: left; max-height: 80vh; overflow-y: auto; }
    .lecteur .emoji { text-align: center; }
    .lecteur h1 { text-align: center; margin-bottom: 4px; }
    .lecteur p.sous { text-align: center; font-size: 12px; color: #999; margin-bottom: 22px; }
    .piste {
      background: #f7f4ee; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .piste .titre {
      font-size: 14px; font-weight: 800; color: #1a2440; margin-bottom: 8px;
    }
    .piste iframe {
      width: 100%; height: 130px; border: none; border-radius: 8px;
      background: #fff;
    }
    .note-fin {
      margin-top: 18px; font-size: 11.5px; color: #aaa;
      text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="boite" id="ecran-code">
    <span class="emoji">🎧</span>
    <h1>Ma musique</h1>
    <p class="intro">Entre le code que Sébastien t'a envoyé pour écouter les morceaux.</p>
    <input type="text" id="code-input" maxlength="20" placeholder="CODE" autocomplete="off" inputmode="text"/>
    <div class="erreur" id="erreur-msg">Code incorrect, réessaie.</div>
    <button class="btn-valider" id="btn-valider">Écouter</button>
    <a href="/" class="retour">← Retour au site</a>
  </div>

  <div class="boite lecteur" id="ecran-lecteur">
    <span class="emoji">🎶</span>
    <h1>Bonne écoute</h1>
    <p class="sous">Les aventures d'Oldy et Sébastien</p>
    <div id="liste-pistes"></div>
    <p class="note-fin">Merci de ne pas rediffuser ces morceaux sans autorisation. © Sébastien TRIBET.</p>
    <a href="/" class="retour" style="display:block; text-align:center; margin-top:14px;">← Retour au site</a>
  </div>

<script>
  // ---- Le code d'accès : change-le ici quand tu veux ----
  const CODE_MUSIQUE = "OLDYMUSIC";

  // ---- Liste des morceaux ----
  const PISTES = [
    { titre: "Ma Vie 1",                        id: "1A6KSE3dw2ehyp0rwuUPmfziv8j-XePnr" },
    { titre: "Rupture invisible visible",       id: "18W4uNybP201XMi9cKXKskhsPfOMB9rP6" },
    { titre: "Face à face",                     id: "19HoLOrlb2rj2W-f1P7ucvDlkWKYxOVqo" },
    { titre: "Non aux jugements",               id: "1E4jZpSteaJo1B1A3GU9Ro3bk7-VTPlNK" },
    { titre: "L'invisible bis",                 id: "1EIi3DdTZQqbhWN4PkqCJq_9bMjO22tPh" },
    { titre: "La dépression",                   id: "1GV1ejpp_MKVxoS8drGzK3dx9vPcM_fpv" },
    { titre: "Je suis encore là",                id: "1JfJsfStLqq1KfwmvQqUZdQRj7f5f4ibO" },
    { titre: "Techno trance l'invisible",       id: "1M_Xole5_omHmhdf0LNI_wP2h-2sL4I2o" },
    { titre: "Je reviens",                       id: "1NSIaCGVSURFCZNVbulMYnRPXPdpupolI" },
    { titre: "Reconstruction",                   id: "1NZXMIPk7hyi_4T32yeAZAk96V44q8eV9" },
    { titre: "Silence",                          id: "1Oc86rZJ6xJ4kvySoCgRWq91Z71YFckvH" },
    { titre: "L'invisible visible",              id: "1ZWywc6RMMc4FtQsTbOcSYX0OVOq3OApG" },
    { titre: "Reggae électro invisible",         id: "1UMPFhsNKvyyFri7P6eT8zJnqfa_miiVd" },
    { titre: "Face à face (2)",                  id: "1VZYliIKwc43QB9LpJj5XGEtAYvwZ1PqN" },
    { titre: "Ma vie",                           id: "1XitCM6pffS9-wMgRPCqyHL8qm2DNs7Nr" },
    { titre: "On te voit pas, on te croit pas",  id: "1qWvBL5-2lld4cwaQ-VcYVx3yU7Ee-hwx" },
    { titre: "De quel droit",                    id: "1uCTVKohK2w6gyeMKoJv1-LbaakpPoQrn" }
  ];

  const ecranCode = document.getElementById('ecran-code');
  const ecranLecteur = document.getElementById('ecran-lecteur');
  const input = document.getElementById('code-input');
  const btn = document.getElementById('btn-valider');
  const erreurMsg = document.getElementById('erreur-msg');

  function afficherLecteur() {
    const ecranLecteur = document.getElementById('ecran-lecteur');
    
    // On crée un lecteur unique propre avec une liste de pistes interactive
    ecranLecteur.innerHTML = `
        <div style="text-align: center; margin-bottom: 20px;">
            <audio id="audio-player" controls style="width: 100%; max-width: 500px;"></audio>
            <div id="titre-actif" style="font-weight: bold; margin-top: 10px; font-size: 1.1em;">Sélectionne une piste</div>
        </div>
        <div id="liste-pistes-container" style="max-height: 400px; overflow-y: auto;">
            ${PISTES.map((p, index) => `
                <div class="piste-item" data-index="${index}" data-id="${p.id}" style="padding: 10px; margin: 5px 0; background: #f1f1f1; cursor: pointer; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                    <span>${p.titre}</span>
                    <button style="padding: 5px 10px; cursor: pointer;">Lire</button>
                </div>
            `).join('')}
        </div>
    `;

    document.getElementById('ecran-code').style.display = 'none';
    ecranLecteur.style.display = 'block';

    const audioPlayer = document.getElementById('audio-player');
    const titreActif = document.getElementById('titre-actif');
    const pistesElements = document.querySelectorAll('.piste-item');
    
    let pisteActuelle = 0;

    // Fonction pour charger et jouer une piste
    function chargerPiste(index) {
        pisteActuelle = index;
        const piste = PISTES[pisteActuelle];
        titreActif.textContent = piste.titre;
        
        // Utilisation du lien de téléchargement direct Google Drive pour le lecteur HTML5 audio
        audioPlayer.src = `https://docs.google.com/uc?export=download&id=${piste.id}`;
        audioPlayer.play().catch(e => console.log("Lecture automatique bloquée par le navigateur :", e));
        
        // Mettre en valeur visuellement la piste en cours
        pistesElements.forEach((el, i) => {
            el.style.background = i === pisteActuelle ? '#d1e7dd' : '#f1f1f1';
        });
    }

    // Gestion des clics sur les pistes de la liste
    pistesElements.forEach((el, index) => {
        el.addEventListener('click', () => {
            chargerPiste(index);
        });
    });

    // Enchaînement automatique vers la piste suivante à la fin de la lecture
    audioPlayer.addEventListener('ended', () => {
        pisteActuelle++;
        if (pisteActuelle < PISTES.length) {
            chargerPiste(pisteActuelle);
        } else {
            titreActif.textContent = "Fin de la liste de lecture";
        }
    });
}

  if (sessionStorage.getItem('musique_deverrouille') === '1') {
    afficherLecteur();
  }

  function validerCode() {
    const saisie = input.value.trim().toUpperCase();
    if (saisie === CODE_MUSIQUE.toUpperCase()) {
      erreurMsg.style.display = 'none';
      sessionStorage.setItem('musique_deverrouille', '1');
      afficherLecteur();
    } else {
      erreurMsg.style.display = 'block';
    }
  }

  btn.addEventListener('click', validerCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') validerCode(); });
</script>
</body>
</html>
